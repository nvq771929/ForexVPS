name: V224 full EA and learning validation
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-deep.txt
      - run: python -m unittest discover -s tests -v
      - name: Supervisor and pre-lock dialogue tests
        working-directory: LearningSupervisor
        run: python -m unittest discover -s tests -v
